<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping & Momo Date ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e8,#ffe9c9,#dff7ff);
    overflow:hidden;
}

.card{
    width:90%;
    max-width:360px;
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
    color:#ff4081;
    margin-bottom:15px;
}

p{
    font-size:18px;
    color:#444;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    position:relative;
}

button{
    border:none;
    padding:12px 28px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

#yes{
    background:#ff4081;
    color:white;
}

#yes:hover{
    transform:scale(1.08);
}

#no{
    background:white;
    color:#ff4081;
}

#result{
    margin-top:20px;
    font-size:20px;
    color:#ff4081;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
    <h1>Hey!! ❤️</h1>

    <p>
        You are selected to take me for a
        <b>Shopping 🛍️ & Momo 🌮 Date</b>.<br><br>
        Are you interested? 🥺
    </p>

    <div class="buttons">
        <button id="yes">Yes ❤️</button>
        <button id="no">No 😒</button>
    </div>

    <div id="result"></div>

</div>

<script>

const yes=document.getElementById("yes");
const no=document.getElementById("no");
const result=document.getElementById("result");

let count=0;

function moveButton(){

count++;

no.style.position="fixed";

const x=Math.random()*(window.innerWidth-100);
const y=Math.random()*(window.innerHeight-60);

no.style.left=x+"px";
no.style.top=y+"px";

const msgs=[
"Hehe 😜",
"Try Again 😂",
"No Allowed 🤭",
"Momo to khilana padega 😏",
"yes or sucide❤️"
];

result.innerHTML=msgs[Math.min(count-1,msgs.length-1)];

if(count>=5){
    no.style.display="none";
    result.innerHTML="Ab sirf Yes hi betaa 😏❤️";
}

}

no.addEventListener("mouseover",moveButton);
no.addEventListener("touchstart",function(e){
    e.preventDefault();
    moveButton();
});
no.addEventListener("click",moveButton);

yes.addEventListener("click",function(){

document.body.innerHTML=`

<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e8,#fff3c7);
">

<div style="
background:white;
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
max-width:350px;
width:90%;
">

<h1 style="color:#ff4081;">Yayyyy!! 🥹💖</h1>

<h2>Thank You ❤️</h2>

<p style="font-size:20px;margin-top:15px;">
Shopping Date 🛍️ ✔️<br>
Momo Date 🌮 ✔️<br><br>

Hehe... to kab leke jare (: 💕
</p>

</div>

</div>

`;

});

</script>

</body>
</html>
